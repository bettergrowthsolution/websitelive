<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Send Email</title>
  <style>
    body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:2rem}
    .wrap{max-width:640px;margin:auto;background:#1e293b;padding:2rem;border-radius:14px}
    h1{margin-top:0}
    input,textarea,button{width:100%;padding:.7rem;margin:.4rem 0;border-radius:8px;
                          border:1px solid #334155;background:#0f172a;color:#e2e8f0;box-sizing:border-box}
    textarea{min-height:180px;resize:vertical}
    button{background:#3b82f6;border:none;cursor:pointer;font-weight:600}
    button:hover{background:#2563eb}
    a{color:#60a5fa;text-decoration:none;font-size:.9rem}
    .msg{margin-top:1rem;font-size:.9rem}
    label{font-size:.85rem;color:#94a3b8}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="index.html">← Back</a>
    <h1>Send Email</h1>

    <label>To *</label>
    <input id="to" placeholder="candidate@example.com" />

    <label>CC (comma-separated)</label>
    <input id="cc" placeholder="manager@example.com" />

    <label>BCC (comma-separated)</label>
    <input id="bcc" placeholder="records@example.com" />

    <label>Subject *</label>
    <input id="subject" placeholder="Interview Invitation" />

    <label>Body (HTML allowed) *</label>
    <textarea id="body" placeholder="<p>Hi...</p>"></textarea>

    <label>Attachment (optional)</label>
    <input id="attachment" type="file" />

    <button onclick="send()">Send Email</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
  async function send() {
    const fd = new FormData();
    fd.append("to", document.getElementById("to").value);
    fd.append("cc", document.getElementById("cc").value);
    fd.append("bcc", document.getElementById("bcc").value);
    fd.append("subject", document.getElementById("subject").value);
    fd.append("body", document.getElementById("body").value);
    fd.append("sent_by", localStorage.getItem("user") || "unknown");
    const file = document.getElementById("attachment").files[0];
    if (file) fd.append("attachment", file);

    document.getElementById("msg").textContent = "Sending...";
    const r = await fetch("/api/send", { method: "POST", body: fd });
    const data = await r.json();
    document.getElementById("msg").textContent = data.ok ? "✅ Sent!" : "❌ Failed: " + JSON.stringify(data);
  }
</script>
</body>
</html>
