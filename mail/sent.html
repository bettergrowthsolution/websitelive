<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Sent</title>
  <style>
    body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:2rem}
    .wrap{max-width:900px;margin:auto}
    a{color:#60a5fa;text-decoration:none}
    table{width:100%;border-collapse:collapse;margin-top:1rem;font-size:.9rem}
    th,td{padding:.6rem;border-bottom:1px solid #334155;text-align:left;vertical-align:top}
    th{color:#94a3b8;font-weight:600}
    .ok{color:#4ade80}.fail{color:#f87171}
    .body{max-width:300px;white-space:pre-wrap;font-size:.8rem;color:#cbd5e1}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="index.html">← Back</a>
    <h1>Sent Emails</h1>
    <table>
      <thead>
        <tr><th>Time</th><th>To</th><th>Subject</th><th>Attachment</th><th>Status</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

<script>
  (async () => {
    const r = await fetch("/api/sent");
    const list = await r.json();
    document.getElementById("rows").innerHTML = list.map(e => `
      <tr>
        <td>${new Date(e.created_at).toLocaleString()}</td>
        <td>${e.to_email || ""}${e.cc_email ? "<br><small>CC: " + e.cc_email + "</small>" : ""}</td>
        <td>${e.subject || ""}</td>
        <td>${e.attachment_name || "—"}</td>
        <td class="${e.status === 'sent' ? 'ok' : 'fail'}">${e.status}</td>
      </tr>
    `).join("");
  })();
</script>
</body>
</html>
